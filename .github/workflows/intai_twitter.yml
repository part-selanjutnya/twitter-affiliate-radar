name: Radar Twitter Afiliasi

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  berburu_target:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Diperlukan agar bot bisa memperbarui file JSON di repo
    
    steps:
      - name: Tarik Kode dari Repositori
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Modul (requests)
        run: pip install requests

      - name: Jalankan Radar Mata-Mata
        run: python mata_mata.py

      - name: Otomatis Simpan (Commit & Push) Hasil Intai ke Repo
        run: |
          git config --global user.name "Bot Affiliate Radar"
          git config --global user.email "bot@users.noreply.github.com"
          git add data_target.json
          git commit -m "🤖 Update otomatis data target afiliasi baru" || echo "Tidak ada perubahan data"
          git push
