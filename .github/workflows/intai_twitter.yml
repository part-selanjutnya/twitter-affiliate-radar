name: Radar Twitter Afiliasi

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  berburu_target:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Tarik Kode dari Repositori
        uses: actions/checkout@v3

      - name: Siapkan Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Modul (requests)
        run: pip install requests

      - name: Jalankan Radar Mata-Mata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python mata_mata.py
