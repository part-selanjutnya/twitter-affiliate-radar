<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Twitter Affiliate Command Center</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4">🎯 Twitter Affiliate Command Center</h2>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <h5>🚨 Live Feed Peluang Afiliasi Terdeteksi</h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Waktu</th>
                                <th>Kata Kunci</th>
                                <th>Konten / Pertanyaan Pembeli</th>
                                <th>Aksi Cepat</th>
                            </tr>
                        </thead>
                        <tbody id="tabel-data">
                            <tr>
                                <td colspan="4" class="text-center text-muted">Memuat data dari radar...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Skrip untuk membaca database JSON secara otomatis di GitHub Pages -->
    <script>
        fetch('data_target.json')
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('tabel-data');
                tbody.innerHTML = '';
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Belum ada target yang cocok.</td></tr>';
                    return;
                }

                data.forEach(item => {
                    let tr = `<tr>
                        <td>${item.waktu}</td>
                        <td><span class="badge bg-success">${item.keyword}</span></td>
                        <td>${item.konten}</td>
                        <td>
                            <a href="${item.link}" target="_blank" class="btn btn-sm btn-primary">⚡ Balas & Tawarkan</a>
                        </td>
                    </tr>`;
                    tbody.innerHTML += tr;
                });
            })
            .catch(error => {
                document.getElementById('tabel-data').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Gagal memuat data atau file database belum ada.</td></tr>';
            });
    </script>
</body>
</html>
